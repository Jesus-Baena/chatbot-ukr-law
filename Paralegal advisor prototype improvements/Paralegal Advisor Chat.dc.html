<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f6f8fa; }
  * { box-sizing: border-box; }
  a { color: #1d4ed8; } a:hover { color: #1e40af; }
  @keyframes pulse-dot { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }
  @keyframes msg-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  textarea::placeholder { color: #94a3b8; }
  textarea:focus { outline: none; }
</style>
</helmet>
<div style="display: flex; flex-direction: column; height: 100vh; font-family: 'Public Sans', sans-serif; color: #1e293b; background: #f6f8fa;">
  <!-- Header -->
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; background: #ffffff; border-bottom: 1px solid #e2e8f0; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 14px; min-width: 0;">
      <a href="https://baena.ai/demos" style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-decoration: none; color: #64748b;" style-hover="color: #1e293b;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        {{ t_back }}
      </a>
      <div style="width: 1px; height: 20px; background: #e2e8f0;"></div>
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
        <div style="width: 32px; height: 32px; border-radius: 8px; background: #1e3a5f; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e8d5a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M5 7l7-4 7 4"></path><path d="M5 7l-2 6a3.5 3.5 0 0 0 7 0L8 7"></path><path d="M19 7l-2 6a3.5 3.5 0 0 0 7 0l-2-6" transform="translate(-3 0)"></path><path d="M8 21h8"></path></svg>
        </div>
        <div style="min-width: 0;">
          <div style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ t_title }}</div>
          <div style="font-size: 12px; color: #64748b; white-space: nowrap;">{{ t_subtitle }}</div>
        </div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
      <!-- Language toggle -->
      <div style="display: flex; background: #f1f5f9; border-radius: 8px; padding: 3px;">
        <button onClick="{{ setLangEn }}" style="border: none; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 6px; background: {{ enBg }}; color: {{ enColor }}; box-shadow: {{ enShadow }};">EN</button>
        <button onClick="{{ setLangUk }}" style="border: none; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 6px; background: {{ ukBg }}; color: {{ ukColor }}; box-shadow: {{ ukShadow }};">UK</button>
      </div>
      <!-- Download menu -->
      <sc-if value="{{ hasMessages }}" hint-placeholder-val="{{ false }}">
        <div data-dl-menu="1" style="position: relative;">
          <button onClick="{{ toggleDownload }}" style="display: flex; align-items: center; gap: 7px; border: 1px solid #cbd5e1; background: #ffffff; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; color: #334155; padding: 7px 14px; border-radius: 8px;" style-hover="background: #f8fafc; border-color: #94a3b8;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>
            {{ t_download }}
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <sc-if value="{{ downloadOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: calc(100% + 6px); right: 0; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; box-shadow: 0 8px 24px rgba(15,23,42,0.12); padding: 6px; z-index: 50; min-width: 220px;">
              <button onClick="{{ downloadMarkdown }}" style="display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; color: #334155; padding: 9px 10px; border-radius: 7px; text-align: left;" style-hover="background: #f1f5f9;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg>
                <span>{{ t_dl_md }}<br><span style="font-size: 11px; color: #94a3b8; font-weight: 400;">{{ t_dl_md_sub }}</span></span>
              </button>
              <button onClick="{{ downloadPdf }}" style="display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; color: #334155; padding: 9px 10px; border-radius: 7px; text-align: left;" style-hover="background: #f1f5f9;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 14h12v8H6z"></path></svg>
                <span>{{ t_dl_pdf }}<br><span style="font-size: 11px; color: #94a3b8; font-weight: 400;">{{ t_dl_pdf_sub }}</span></span>
              </button>
            </div>
          </sc-if>
        </div>
      </sc-if>
      <a href="https://baena.ai/articles/paralegal-advisor" style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-decoration: none; color: #64748b; padding: 7px 10px; border-radius: 8px;" style-hover="background: #f1f5f9; color: #1e293b;">
        {{ t_article }}
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14L21 3"></path></svg>
      </a>
    </div>
  </header>

  <!-- Disclaimer banner -->
  <sc-if value="{{ showDisclaimer }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: #fdf6e3; border-bottom: 1px solid #f0e2b6; flex-shrink: 0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a16207" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
      <div style="font-size: 13px; color: #713f12; line-height: 1.45; flex: 1;">{{ t_disclaimer }}</div>
      <button onClick="{{ dismissDisclaimer }}" style="border: none; background: transparent; cursor: pointer; color: #a16207; padding: 4px; border-radius: 6px; flex-shrink: 0; display: flex;" style-hover="background: rgba(161,98,7,0.1);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
      </button>
    </div>
  </sc-if>

  <!-- Chat scroll area -->
  <div ref="{{ scrollRef }}" style="flex: 1; overflow-y: auto; min-height: 0;">
    <div style="max-width: 760px; margin: 0 auto; padding: 32px 24px 24px;">

      <!-- Empty state -->
      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 56px 0 24px;">
          <div style="width: 56px; height: 56px; border-radius: 16px; background: #1e3a5f; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(30,58,95,0.25);">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#e8d5a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M5 7l7-4 7 4"></path><path d="M5 7l-2 6a3.5 3.5 0 0 0 7 0L8 7"></path><path d="M16 7l-2 6a3.5 3.5 0 0 0 7 0l-2-6"></path><path d="M8 21h8"></path></svg>
          </div>
          <h1 style="font-family: 'Source Serif 4', serif; font-size: 26px; font-weight: 700; margin: 0 0 10px; color: #0f172a;">{{ t_empty_title }}</h1>
          <p style="font-size: 14.5px; line-height: 1.6; color: #475569; max-width: 520px; margin: 0 0 32px; text-wrap: pretty;">{{ t_empty_desc }}</p>
          <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 560px;">
            <sc-for list="{{ suggestions }}" as="sug" hint-placeholder-count="3">
              <button onClick="{{ sug.ask }}" style="display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid #e2e8f0; background: #ffffff; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; color: #334155; padding: 14px 18px; border-radius: 12px; transition: all 0.15s ease; box-shadow: 0 1px 2px rgba(15,23,42,0.04);" style-hover="border-color: #1e3a5f; box-shadow: 0 4px 12px rgba(30,58,95,0.1); transform: translateY(-1px);">
                <span style="width: 28px; height: 28px; border-radius: 8px; background: #eef4fa; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #1e3a5f;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg>
                </span>
                {{ sug.text }}
              </button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <!-- Messages -->
      <div style="display: flex; flex-direction: column; gap: 24px;">
        <sc-for list="{{ messages }}" as="msg" hint-placeholder-count="0">
          <div style="display: flex; flex-direction: column; animation: msg-in 0.3s ease;">
            <!-- User message -->
            <sc-if value="{{ msg.isUser }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; justify-content: flex-end;">
                <div style="background: #1e3a5f; color: #f1f5f9; font-size: 14.5px; line-height: 1.55; padding: 12px 18px; border-radius: 16px 16px 4px 16px; max-width: 78%; box-shadow: 0 2px 6px rgba(30,58,95,0.18);">{{ msg.text }}</div>
              </div>
            </sc-if>
            <!-- Assistant message -->
            <sc-if value="{{ msg.isAssistant }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; gap: 12px;">
                <div style="width: 30px; height: 30px; border-radius: 8px; background: #1e3a5f; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e8d5a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M5 7l7-4 7 4"></path><path d="M5 7l-2 6a3.5 3.5 0 0 0 7 0L8 7"></path><path d="M16 7l-2 6a3.5 3.5 0 0 0 7 0l-2-6"></path><path d="M8 21h8"></path></svg>
                </div>
                <div style="flex: 1; min-width: 0;">
                  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 4px 16px 16px 16px; padding: 18px 22px; box-shadow: 0 1px 3px rgba(15,23,42,0.05);">
                    <div style="font-size: 14.5px; line-height: 1.65; color: #1e293b;">{{ msg.body }}</div>
                    <!-- Sources -->
                    <sc-if value="{{ msg.hasSources }}" hint-placeholder-val="{{ false }}">
                      <div style="margin-top: 16px; padding-top: 14px; border-top: 1px solid #eef2f6;">
                        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; margin-bottom: 10px;">{{ t_sources }}</div>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                          <sc-for list="{{ msg.sources }}" as="src" hint-placeholder-count="0">
                            <a href="{{ src.url }}" target="_blank" style="display: flex; gap: 10px; align-items: flex-start; text-decoration: none; padding: 9px 12px; border-radius: 8px; background: #f8fafc; border: 1px solid #eef2f6;" style-hover="border-color: #cbd5e1; background: #f1f5f9;">
                              <span style="width: 20px; height: 20px; border-radius: 6px; background: #1e3a5f; color: #e8d5a3; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{ src.n }}</span>
                              <span style="min-width: 0;">
                                <span style="display: block; font-size: 12.5px; font-weight: 600; color: #1e293b; line-height: 1.4;">{{ src.title }}</span>
                                <span style="display: block; font-size: 11.5px; color: #64748b; margin-top: 2px;">{{ src.detail }}</span>
                              </span>
                            </a>
                          </sc-for>
                        </div>
                      </div>
                    </sc-if>
                  </div>
                  <!-- Message actions -->
                  <div style="display: flex; gap: 4px; margin-top: 6px; margin-left: 4px;">
                    <button onClick="{{ msg.copy }}" title="Copy" style="display: flex; align-items: center; gap: 5px; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 11.5px; font-weight: 600; color: #94a3b8; padding: 4px 8px; border-radius: 6px;" style-hover="background: #eef2f6; color: #475569;">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                      {{ msg.copyLabel }}
                    </button>
                  </div>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-for>

        <!-- Typing indicator -->
        <sc-if value="{{ isThinking }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; gap: 12px; animation: msg-in 0.3s ease;">
            <div style="width: 30px; height: 30px; border-radius: 8px; background: #1e3a5f; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e8d5a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M5 7l7-4 7 4"></path><path d="M5 7l-2 6a3.5 3.5 0 0 0 7 0L8 7"></path><path d="M16 7l-2 6a3.5 3.5 0 0 0 7 0l-2-6"></path><path d="M8 21h8"></path></svg>
            </div>
            <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 4px 16px 16px 16px; padding: 16px 20px; display: flex; align-items: center; gap: 10px;">
              <div style="display: flex; gap: 4px;">
                <span style="width: 7px; height: 7px; border-radius: 50%; background: #1e3a5f; animation: pulse-dot 1.2s infinite ease-in-out;"></span>
                <span style="width: 7px; height: 7px; border-radius: 50%; background: #1e3a5f; animation: pulse-dot 1.2s infinite ease-in-out 0.2s;"></span>
                <span style="width: 7px; height: 7px; border-radius: 50%; background: #1e3a5f; animation: pulse-dot 1.2s infinite ease-in-out 0.4s;"></span>
              </div>
              <span style="font-size: 12.5px; color: #64748b;">{{ t_thinking }}</span>
            </div>
          </div>
        </sc-if>
      </div>
    </div>
  </div>

  <!-- Composer -->
  <div style="flex-shrink: 0; background: linear-gradient(to top, #f6f8fa 70%, rgba(246,248,250,0));">
    <div style="max-width: 760px; margin: 0 auto; padding: 8px 24px 18px;">
      <div style="display: flex; align-items: flex-end; gap: 10px; background: #ffffff; border: 1px solid {{ composerBorder }}; border-radius: 16px; padding: 10px 10px 10px 18px; box-shadow: 0 4px 16px rgba(15,23,42,0.08); transition: border-color 0.15s ease;">
        <textarea ref="{{ inputRef }}" value="{{ draft }}" onChange="{{ onDraftChange }}" onKeyDown="{{ onKeyDown }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" rows="{{ 1 }}" placeholder="{{ t_placeholder }}" style="flex: 1; border: none; resize: none; font-family: inherit; font-size: 14.5px; line-height: 1.5; color: #1e293b; background: transparent; padding: 8px 0; max-height: 140px;"></textarea>
        <button onClick="{{ send }}" disabled="{{ sendDisabled }}" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: none; border-radius: 12px; cursor: {{ sendCursor }}; background: {{ sendBg }}; transition: background 0.15s ease; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
        </button>
      </div>
      <div style="text-align: center; font-size: 11.5px; color: #94a3b8; margin-top: 10px;">{{ t_footer }}</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showDisclaimerBanner&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;}, &quot;defaultLanguage&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;en&quot;, &quot;options&quot;: [&quot;en&quot;, &quot;uk&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behavior&quot;}}">
class Component extends DCLogic {
  state = {
    lang: (this.props && this.props.defaultLanguage) || 'en',
    messages: [],
    draft: '',
    thinking: false,
    downloadOpen: false,
    disclaimerDismissed: false,
    focused: false,
    copiedId: null,
  };

  constructor(props) {
    super(props);
    this.scrollEl = null;
    this.inputEl = null;
  }

  T = {
    en: {
      back: 'Back', title: 'Paralegal Advisor', subtitle: 'Humanitarian NGOs in Ukraine · Live Chat',
      download: 'Download', article: 'Article',
      dl_md: 'Markdown (.md)', dl_md_sub: 'Plain text transcript', dl_pdf: 'PDF (print)', dl_pdf_sub: 'Print-friendly transcript',
      disclaimer: 'This assistant provides general legal information based on Ukrainian legislation, not legal advice. Consult a qualified lawyer before acting on any answer.',
      empty_title: 'Ask about Ukrainian humanitarian law',
      empty_desc: 'Answers are grounded in Verkhovna Rada legislation and a curated humanitarian knowledge base, with sources cited for every claim.',
      sources: 'Sources', thinking: 'Searching legislation…', placeholder: 'Ask a legal question…',
      footer: 'Grounded in Verkhovna Rada law · Not a substitute for professional legal advice',
      copy: 'Copy', copied: 'Copied ✓',
      suggestions: [
        'What are the rights of internally displaced persons under martial law?',
        'How do humanitarian NGOs register to operate in Ukraine?',
        'What compensation exists for housing destroyed during the war?',
      ],
    },
    uk: {
      back: 'Назад', title: 'Параюридичний радник', subtitle: 'Гуманітарні НУО в Україні · Живий чат',
      download: 'Завантажити', article: 'Стаття',
      dl_md: 'Markdown (.md)', dl_md_sub: 'Текстова стенограма', dl_pdf: 'PDF (друк)', dl_pdf_sub: 'Стенограма для друку',
      disclaimer: 'Цей помічник надає загальну юридичну інформацію на основі законодавства України, а не юридичну консультацію. Перед дією зверніться до кваліфікованого юриста.',
      empty_title: 'Запитайте про гуманітарне право України',
      empty_desc: 'Відповіді ґрунтуються на законодавстві Верховної Ради та кураторській базі гуманітарних знань, з посиланнями на джерела.',
      sources: 'Джерела', thinking: 'Пошук у законодавстві…', placeholder: 'Поставте юридичне запитання…',
      footer: 'На основі законів Верховної Ради · Не замінює професійну юридичну консультацію',
      copy: 'Копіювати', copied: 'Скопійовано ✓',
      suggestions: [
        'Які права мають внутрішньо переміщені особи в умовах воєнного стану?',
        'Як гуманітарні НУО реєструються для роботи в Україні?',
        'Яка компенсація передбачена за житло, зруйноване під час війни?',
      ],
    },
  };

  ANSWERS = {
    en: [
      {
        match: /displaced|idp|переміщен/i,
        body: 'Internally displaced persons (IDPs) in Ukraine retain full civil, political, social and economic rights under martial law. Law No. 1706-VII "On Ensuring Rights and Freedoms of IDPs" guarantees the right to registration at a new place of residence, monthly living allowances, access to housing, employment, education and healthcare, and protection from discrimination. Under martial law, Resolution No. 332 simplified the IDP registration procedure — applications can be filed online via the Diia portal, and allowances are paid regardless of registered residence. IDPs also retain voting rights, though exercising them requires a change of electoral address.',
        sources: [
          { n: 1, title: 'Law of Ukraine No. 1706-VII "On Ensuring the Rights and Freedoms of Internally Displaced Persons"', detail: 'Verkhovna Rada · Arts. 7–9, as amended 2023', url: 'https://zakon.rada.gov.ua/laws/show/1706-18' },

  componentDidMount() {
    document.addEventListener('click', this.onDocClick);
  }
  componentWillUnmount() {
    document.removeEventListener('click', this.onDocClick);
    clearTimeout(this.thinkTimer);
    clearTimeout(this.copyTimer);
  }
  onDocClick = (e) => {
    if (this.state.downloadOpen && !e.target.closest('[data-dl-menu]')) this.setState({ downloadOpen: false });
  };

  scrollToBottom() {
    requestAnimationFrame(() => {
      if (this.scrollEl) this.scrollEl.scrollTop = this.scrollEl.scrollHeight;
    });
  }

  ask(text) {
    if (!text.trim() || this.state.thinking) return;
    const userMsg = { id: Date.now(), role: 'user', text: text.trim() };
    this.setState(s => ({ messages: [...s.messages, userMsg], draft: '', thinking: true }), () => this.scrollToBottom());
    if (this.inputEl) this.inputEl.style.height = 'auto';
    this.thinkTimer = setTimeout(() => {
      const lang = this.state.lang;
      const bank = this.ANSWERS[lang];
      const hit = bank.find(a => a.match.test(text)) || this.ANSWERS.fallback[lang];
      const aMsg = { id: Date.now() + 1, role: 'assistant', body: hit.body, sources: hit.sources };
      this.setState(s => ({ messages: [...s.messages, aMsg], thinking: false }), () => this.scrollToBottom());
    }, 1800);
  }

  buildMarkdown() {
    const t = this.T[this.state.lang];
    const lines = ['# ' + t.title + ' — transcript', '', new Date().toLocaleString(), ''];
    this.state.messages.forEach(m => {
      if (m.role === 'user') { lines.push('**Q:** ' + m.text, ''); }
      else {
        lines.push('**A:** ' + m.body, '');
        if (m.sources && m.sources.length) {
          lines.push('_' + t.sources + ':_');
          m.sources.forEach(s => lines.push('- [' + s.title + '](' + s.url + ') — ' + s.detail));
          lines.push('');
        }
      }
    });
    lines.push('---', t.disclaimer);
    return lines.join('\n');
  }

  downloadMd = () => {
    const blob = new Blob([this.buildMarkdown()], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'paralegal-advisor-transcript.md';
    a.click();
    URL.revokeObjectURL(a.href);
    this.setState({ downloadOpen: false });
  };

  downloadPdf = () => {
    const t = this.T[this.state.lang];
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    let html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(t.title) + ' — transcript</title><style>body{font-family:Georgia,serif;max-width:680px;margin:40px auto;color:#1e293b;line-height:1.6;font-size:13pt}h1{font-size:19pt;border-bottom:2px solid #1e3a5f;padding-bottom:8px}.q{font-weight:bold;color:#1e3a5f;margin-top:28px}.src{font-size:10pt;color:#555;margin:4px 0 0 16px}.disc{margin-top:36px;padding-top:12px;border-top:1px solid #ccc;font-size:10pt;color:#777}@media print{body{margin:0.5in auto}}</style></head><body>';
    html += '<h1>' + esc(t.title) + ' — transcript</h1><p style="color:#777;font-size:10pt">' + new Date().toLocaleString() + '</p>';
    this.state.messages.forEach(m => {
      if (m.role === 'user') html += '<p class="q">Q: ' + esc(m.text) + '</p>';
      else {
        html += '<p>' + esc(m.body) + '</p>';
        if (m.sources && m.sources.length) {
          html += '<p style="font-size:10pt;color:#555;margin-bottom:2px"><em>' + esc(t.sources) + ':</em></p>';
          m.sources.forEach(s => { html += '<p class="src">[' + s.n + '] ' + esc(s.title) + ' — ' + esc(s.detail) + '<br>' + esc(s.url) + '</p>'; });
        }
      }
    });
    html += '<p class="disc">' + esc(t.disclaimer) + '</p></body></html>';
    const w = window.open('', '_blank');
    if (w) { w.document.write(html); w.document.close(); setTimeout(() => w.print(), 300); }
    this.setState({ downloadOpen: false });
  };

  copyMsg(m) {
    const text = m.body + (m.sources ? '\n\n' + m.sources.map(s => '[' + s.n + '] ' + s.title + ' — ' + s.url).join('\n') : '');
    try { navigator.clipboard.writeText(text); } catch (e) {}
    this.setState({ copiedId: m.id });
    clearTimeout(this.copyTimer);
    this.copyTimer = setTimeout(() => this.setState({ copiedId: null }), 1600);
  }

  autoGrow = () => {
    if (!this.inputEl) return;
    this.inputEl.style.height = 'auto';
    this.inputEl.style.height = Math.min(this.inputEl.scrollHeight, 140) + 'px';
  };

  renderVals() {
    const { lang, messages, draft, thinking, downloadOpen, disclaimerDismissed, focused, copiedId } = this.state;
    const t = this.T[lang];
    const canSend = draft.trim().length > 0 && !thinking;
    return {
      t_back: t.back, t_title: t.title, t_subtitle: t.subtitle, t_download: t.download, t_article: t.article,
      t_dl_md: t.dl_md, t_dl_md_sub: t.dl_md_sub, t_dl_pdf: t.dl_pdf, t_dl_pdf_sub: t.dl_pdf_sub,
      t_disclaimer: t.disclaimer, t_empty_title: t.empty_title, t_empty_desc: t.empty_desc,
      t_sources: t.sources, t_thinking: t.thinking, t_placeholder: t.placeholder, t_footer: t.footer,
      setLangEn: () => this.setState({ lang: 'en' }),
      setLangUk: () => this.setState({ lang: 'uk' }),
      enBg: lang === 'en' ? '#ffffff' : 'transparent',
      enColor: lang === 'en' ? '#1e3a5f' : '#64748b',
      enShadow: lang === 'en' ? '0 1px 3px rgba(15,23,42,0.12)' : 'none',
      ukBg: lang === 'uk' ? '#ffffff' : 'transparent',
      ukColor: lang === 'uk' ? '#1e3a5f' : '#64748b',
      ukShadow: lang === 'uk' ? '0 1px 3px rgba(15,23,42,0.12)' : 'none',
      hasMessages: messages.length > 0,
      downloadOpen,
      toggleDownload: (e) => { e.stopPropagation(); this.setState(s => ({ downloadOpen: !s.downloadOpen })); },
      downloadMarkdown: this.downloadMd,
      downloadPdf: this.downloadPdf,
      showDisclaimer: (this.props.showDisclaimerBanner ?? true) && !disclaimerDismissed,
      dismissDisclaimer: () => this.setState({ disclaimerDismissed: true }),
      isEmpty: messages.length === 0 && !thinking,
      suggestions: t.suggestions.map(text => ({ text, ask: () => this.ask(text) })),
      messages: messages.map(m => ({
        isUser: m.role === 'user',
        isAssistant: m.role === 'assistant',
        text: m.text,
        body: m.body,
        hasSources: !!(m.sources && m.sources.length),
        sources: m.sources || [],
        copy: () => this.copyMsg(m),
        copyLabel: copiedId === m.id ? t.copied : t.copy,
      })),
      isThinking: thinking,
      scrollRef: (el) => { this.scrollEl = el; },
      inputRef: (el) => { this.inputEl = el; },
      draft,
      onDraftChange: (e) => { this.setState({ draft: e.target.value }); this.autoGrow(); },
      onKeyDown: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.ask(this.state.draft); } },
      onFocus: () => this.setState({ focused: true }),
      onBlur: () => this.setState({ focused: false }),
      composerBorder: focused ? '#1e3a5f' : '#e2e8f0',
      send: () => this.ask(this.state.draft),
      sendDisabled: !canSend,
      sendBg: canSend ? '#1e3a5f' : '#cbd5e1',
      sendCursor: canSend ? 'pointer' : 'default',
    };
  }
}
</script>
